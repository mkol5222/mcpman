<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Code MCP Server Manager</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header-content">
        <div class="logo">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/>
          </svg>
          <h1>MCP Server Manager</h1>
        </div>
        <div class="header-actions">
          <button id="addServerBtn" class="btn btn-secondary" title="Add Server from Catalog">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="5" x2="12" y2="19"/>
              <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            Add
          </button>
          <button id="viewGlobalEnvBtn" class="btn btn-secondary" title="Global Environment Variables">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
            Global Env
          </button>
          <button id="viewConfigBtn" class="btn btn-secondary" title="View/Edit Config">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
            </svg>
            Config
          </button>
          <button id="restartBtn" class="btn btn-warning" title="Restart Claude Desktop">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="23 4 23 10 17 10"/>
              <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
            </svg>
            Restart Claude
          </button>
          <button id="refreshBtn" class="btn btn-secondary" title="Refresh">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 2v6h-6"/>
              <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
              <path d="M3 22v-6h6"/>
              <path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
            </svg>
            Refresh
          </button>
        </div>
      </div>
    </header>

    <main class="main">
      <div id="loading" class="loading hidden">
        <div class="spinner"></div>
        <p>Loading configuration...</p>
      </div>

      <div id="error" class="error-message hidden">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="8" x2="12" y2="12"/>
          <line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        <p id="errorText"></p>
      </div>

      <div id="toast" class="toast hidden">
        <svg id="toastIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
          <polyline points="22 4 12 14.01 9 11.01"/>
        </svg>
        <span id="toastText"></span>
      </div>

      <div id="configInfo" class="config-info hidden">
        <div class="config-path">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
          </svg>
          <span id="configPath"></span>
        </div>
        <div class="server-count">
          <span id="serverCount"></span> servers configured
        </div>
      </div>

      <div id="globalEnvSection" class="global-env-section hidden">
        <div class="global-env-header">
          <div class="global-env-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
            <span>Global Environment Variables</span>
          </div>
          <button id="closeGlobalEnvBtn" class="config-editor-close">&times;</button>
        </div>
        <div class="global-env-content">
          <div id="globalEnvList" class="global-env-list"></div>
          <div class="global-env-add">
            <input type="text" id="newEnvKey" placeholder="Key" class="env-input">
            <input type="text" id="newEnvValue" placeholder="Value" class="env-input">
            <button id="addEnvBtn" class="btn btn-sm btn-success">Add</button>
          </div>
        </div>
      </div>

      <div id="configEditor" class="config-editor hidden">
        <div class="config-editor-header">
          <div class="config-editor-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
            </svg>
            <span>claude_desktop_config.json</span>
          </div>
          <div class="config-editor-actions">
            <button id="editConfigBtn" class="btn btn-sm">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
              </svg>
              Edit
            </button>
            <button id="saveConfigBtn" class="btn btn-sm btn-success hidden">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
                <polyline points="17 21 17 13 7 13 7 21"/>
                <polyline points="7 3 7 8 15 8"/>
              </svg>
              Save
            </button>
            <button id="cancelConfigBtn" class="btn btn-sm hidden">Cancel</button>
            <button id="closeConfigBtn" class="config-editor-close">&times;</button>
          </div>
        </div>
        <div id="configViewer" class="config-viewer">
          <pre><code id="configContent"></code></pre>
        </div>
        <textarea id="configTextarea" class="config-textarea hidden" spellcheck="false"></textarea>
      </div>

      <div id="serversList" class="servers-list">
        <div class="servers-search">
          <div class="servers-search-wrapper">
            <input type="text" id="serversSearchInput" placeholder="Search servers..." class="servers-search-input">
            <button id="serversSearchClear" class="servers-search-clear hidden" title="Clear search">&times;</button>
          </div>
        </div>
        <div id="serversCards"></div>
      </div>

      <div id="noServers" class="no-servers hidden">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
          <line x1="8" y1="21" x2="16" y2="21"/>
          <line x1="12" y1="17" x2="12" y2="21"/>
        </svg>
        <h2>No MCP Servers Found</h2>
        <p>No MCP servers are configured in your Claude Desktop configuration.</p>
      </div>
    </main>

    <div id="serverModal" class="modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modalTitle">Server Details</h2>
          <button class="modal-close" id="modalClose">&times;</button>
        </div>
        <div class="modal-body" id="modalBody">
        </div>
        <div class="modal-footer" id="modalFooter">
        </div>
      </div>
    </div>

    <div id="jsonModal" class="modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-content modal-content-sm">
        <div class="modal-header">
          <h2>Server Configuration JSON</h2>
          <button class="modal-close" id="jsonModalClose">&times;</button>
        </div>
        <div class="modal-body" id="jsonModalBody">
        </div>
      </div>
    </div>

    <div id="catalogModal" class="modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-content modal-content-lg">
        <div class="modal-header">
          <h2>MCP Server Catalog</h2>
          <button class="modal-close" id="catalogModalClose">&times;</button>
        </div>
        <div class="catalog-search">
          <input type="text" id="catalogSearchInput" placeholder="Search servers..." class="catalog-search-input">
        </div>
        <div class="modal-body catalog-body" id="catalogModalBody">
        </div>
      </div>
    </div>

    <div id="logModal" class="modal hidden">
      <div class="modal-backdrop"></div>
      <div class="modal-content modal-content-xl">
        <div class="modal-header">
          <h2 id="logModalTitle">Server Logs</h2>
          <div class="log-header-actions">
            <button id="toggleLogTailBtn" class="btn btn-sm btn-secondary">
              <svg id="logTailIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 12m-1 0a1 1 0 1 0 2 0a1 1 0 1 0 -2 0"/>
                <path d="M12 7a1 1 0 1 0 0 2v5"/>
              </svg>
              <span id="logTailLabel">Pause</span>
            </button>
            <button id="refreshLogBtn" class="btn btn-sm btn-secondary">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 2v6h-6"/>
                <path d="M3 12a9 9 0 0 1 15-6.7L21 8"/>
                <path d="M3 22v-6h6"/>
                <path d="M21 12a9 9 0 0 1-15 6.7L3 16"/>
              </svg>
            </button>
            <button class="modal-close" id="logModalClose">&times;</button>
          </div>
        </div>
        <div class="log-toolbar">
          <input type="text" id="logFilterInput" placeholder="Filter logs..." class="log-filter-input">
          <button id="clearLogFilterBtn" class="btn btn-xs">Clear</button>
          <div class="log-view-toggle">
            <button id="logViewRawBtn" class="btn btn-xs btn-active">Raw</button>
            <button id="logViewStructuredBtn" class="btn btn-xs">Structured</button>
          </div>
        </div>
        <div class="log-modal-content">
          <div class="log-raw-panel" id="logRawPanel">
            <pre id="logContent" class="log-content"></pre>
          </div>
          <div class="log-structured-panel hidden" id="logStructuredPanel">
            <div class="log-events-list" id="logEventsList"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js" type="module"></script>
</body>
</html>
